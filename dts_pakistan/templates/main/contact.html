{% extends 'base.html' %}

{% block content %}
 <!-- Contact Section -->
    <section id="contact" class="py-20 bg-white">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="text-center mb-16">
                <h2 class="text-4xl font-bold text-phthalo mb-4">Get In Touch</h2>
                <p class="text-xl text-gray-600 max-w-3xl mx-auto">
                    Ready to transform your business? Contact DTS Lab Pakistan today for a free consultation.
                </p>
            </div>
            
            <div class="grid lg:grid-cols-2 gap-12">
                <!-- Contact Info -->
                <div class="space-y-8">
                    <div class="bg-buttersmoke p-8 rounded-3xl border border-phthalo/10">
                        <h3 class="text-2xl font-semibold text-phthalo mb-6">Contact Information</h3>
                        <div class="space-y-6">
                            <div class="flex items-center space-x-4">
                                <div class="w-12 h-12 bg-phthalo rounded-2xl flex items-center justify-center">
                                    <i class="fas fa-map-marker-alt text-white"></i>
                                </div>
                                <div>
                                    <div class="font-medium text-gray-900">Location</div>
                                    <div class="text-gray-600">Shekhupura, Punjab, Pakistan</div>
                                </div>
                            </div>
                            <div class="flex items-center space-x-4">
                                <div class="w-12 h-12 bg-phthalo rounded-2xl flex items-center justify-center">
                                    <i class="fas fa-phone text-white"></i>
                                </div>
                                <div>
                                    <div class="font-medium text-gray-900">Phone</div>
                                    <div class="text-gray-600">+92 XXX XXXXXXX</div>
                                </div>
                            </div>
                            <div class="flex items-center space-x-4">
                                <div class="w-12 h-12 bg-phthalo rounded-2xl flex items-center justify-center">
                                    <i class="fas fa-envelope text-white"></i>
                                </div>
                                <div>
                                    <div class="font-medium text-gray-900">Email</div>
                                    <div class="text-gray-600">info@dtslabpakistan.com</div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                
                <!-- Contact Form -->
                <div class="bg-gray-50 p-8 rounded-3xl">
                    <h3 class="text-2xl font-semibold text-phthalo mb-6">Send us a Message</h3>
                    <div class="space-y-6">
                        <div>
                            <input type="text" placeholder="Your Name" class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:border-phthalo focus:outline-none focus:ring-1 focus:ring-phthalo">
                        </div>
                        <div>
                            <input type="email" placeholder="Your Email" class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:border-phthalo focus:outline-none focus:ring-1 focus:ring-phthalo">
                        </div>
                        <div>
                            <select class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:border-phthalo focus:outline-none focus:ring-1 focus:ring-phthalo">
                                <option>Select Service</option>
                                <option>Web Development</option>
                                <option>Mobile Development</option>
                                <option>Testing Services</option>
                                <option>Cloud Solutions</option>
                                <option>Digital Strategy</option>
                            </select>
                        </div>
                        <div>
                            <textarea placeholder="Your Message" rows="4" class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:border-phthalo focus:outline-none focus:ring-1 focus:ring-phthalo resize-none"></textarea>
                        </div>
                        <button class="w-full bg-phthalo text-white py-3 rounded-xl font-semibold hover:bg-phthalo-light transition-colors">
                            Send Message
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </section>

{% endblock %}
